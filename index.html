<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Phòng làm việc 3D pixel của Lý Huỳnh Long, Graphic Designer. Bấm vào từng món đồ để xem dự án: The Next Banker, ACB, Saigon Co.op, PNJ.">
<meta property="og:title" content="Phòng Của Long · Lý Huỳnh Long, Graphic Designer">
<meta property="og:description" content="Đi dạo trong căn phòng 3D pixel và xem các dự án thiết kế.">
<meta property="og:type" content="website">
<meta property="og:image" content="img/banner-career.webp">
<meta name="theme-color" content="#16131b">
<title>Phòng Của Long</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=VT323&display=swap">
<style>
/* Layout: căn phòng voxel ấm áp chiếm toàn màn hình; HUD kem nổi ở góc, thẻ dự án trượt ra từ góc dưới. */
:root{
  --bg:#16131b; --ink:#f1ecf6; --muted:#ffffff; --acc:#ff5fd8; --acc2:#7ff0ff; --done:#7ff0ff;
  --panel:rgba(30,25,40,.95); --line:rgba(255,95,216,.35); --shadow:0 6px 22px rgba(0,0,0,.5);
  --body:'Be Vietnam Pro',system-ui,sans-serif; --pix:'VT323',ui-monospace,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#gl{image-rendering:pixelated;image-rendering:crisp-edges;position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:var(--bg)}
#pins{position:fixed;inset:0;pointer-events:none;transition:opacity .25s}
#pins.off{opacity:0}
.pin{position:absolute;left:0;top:0;width:28px;height:28px;margin:-14px 0 0 -14px;padding:0;cursor:pointer;border-radius:50%;
  border:3px solid var(--acc);background:#2a2433;color:var(--ink);font:22px/1 var(--pix);pointer-events:auto;box-shadow:0 2px 8px rgba(70,45,20,.35)}
.pin::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:3px solid var(--acc);animation:ping 1.8s ease-out infinite}
.pin.done{border-color:var(--done);color:var(--done);width:24px;height:24px;margin:-12px 0 0 -12px}
.pin.done::after{display:none}
.pin:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
@keyframes ping{from{transform:scale(1);opacity:.9}to{transform:scale(1.9);opacity:0}}
.hud{position:fixed;z-index:5}
#hint{top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));width:min(340px,calc(100vw - 32px - 150px));
  background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
#hint p{margin:0;font-size:13px;line-height:1.45}
#listBtn{margin-top:8px;display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;border-top:1px solid var(--line);
  padding:8px 0 0;color:var(--ink);font:21px/1 var(--pix);cursor:pointer;text-align:left}
#listBtn .plus{margin-left:auto;color:var(--acc);font-size:26px}
#count{color:var(--acc)}
#list[hidden]{display:none}
#list{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:2px;max-height:40vh;overflow:auto}
#list button{width:100%;text-align:left;background:none;border:0;color:var(--ink);font:13px var(--body);padding:5px 4px;cursor:pointer;display:flex;gap:8px}
#list button[disabled]{color:var(--muted);cursor:default}
#list .ck{font-family:var(--pix);font-size:19px;line-height:1;color:var(--done);width:1em}
#snd{top:calc(12px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);
  border:2px solid var(--line);border-radius:12px;color:var(--ink);font:21px/1 var(--pix);padding:8px 12px;cursor:pointer;box-shadow:var(--shadow)}
#zoom{bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;
  background:var(--panel);border:2px solid var(--line);border-radius:12px;font:21px/1 var(--pix);box-shadow:var(--shadow)}
#zoom button{background:none;border:0;color:var(--acc);font:28px/1 var(--pix);width:42px;height:36px;cursor:pointer}
#zoom span{min-width:56px;text-align:center}
#tip{position:fixed;z-index:6;pointer-events:none;background:var(--ink);color:#16131b;font:20px/1 var(--pix);padding:5px 9px;border-radius:6px;
  transform:translate(14px,14px);white-space:nowrap}
#panel{position:fixed;z-index:7;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:min(390px,calc(100vw - 32px));max-height:calc(100vh - 150px);overflow:auto;background:var(--panel);border:2px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);padding:14px 16px 16px;animation:rise .3s ease-out}
@keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
#pClose{position:absolute;top:8px;right:8px;width:34px;height:34px;background:#2a2433;border:2px solid var(--line);border-radius:50%;color:var(--ink);font:24px/1 var(--pix);cursor:pointer;z-index:1}
.fig{margin:0 0 12px}
#pMain{display:block;width:100%;padding:0;border:2px solid var(--line);border-radius:8px;overflow:hidden;background:#0e0c12;cursor:zoom-in}
#pImg{display:block;width:100%;height:210px;object-fit:contain}
#pCap{font:19px/1.2 var(--pix);color:var(--muted);margin:6px 0}
#pThumbs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
#pThumbs button{flex:0 0 auto;width:54px;height:54px;padding:0;border:2px solid transparent;border-radius:6px;overflow:hidden;background:#0e0c12;cursor:pointer}
#pThumbs button.on{border-color:var(--acc)}
#pThumbs img{display:block;width:100%;height:100%;object-fit:cover}
#lb{position:fixed;inset:0;z-index:20;background:rgba(25,18,12,.95);display:grid;place-items:center;cursor:zoom-out;padding:16px}
#lb[hidden]{display:none}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
#pTag{margin:0;font:21px/1 var(--pix);letter-spacing:.06em;text-transform:uppercase;color:var(--acc)}
#pTitle{margin:6px 0 8px;font:800 20px/1.25 var(--body);text-wrap:balance;padding-right:30px}
#pDesc{margin:0 0 12px;color:#fff}
#pMeta{margin:0;display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px}
#pMeta div{display:grid;grid-template-columns:104px 1fr;gap:10px}
#pMeta dt{font:19px/1.2 var(--pix);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
#pMeta dd{margin:0;min-width:0;overflow-wrap:anywhere}
#pCta{display:block;margin-top:12px;text-align:center;background:var(--acc);color:#16131b;font:700 15px var(--body);padding:11px 14px;border-radius:10px;text-decoration:none}
#pCta:hover{filter:brightness(1.1)}

#arc{position:fixed;inset:0;z-index:15;display:grid;place-items:center;background:rgba(8,6,14,.9);padding:16px;overflow:auto}
#arc[hidden]{display:none}
.arcBox{width:min(880px,100%);background:#0b0912;border:3px solid var(--acc);border-radius:16px;padding:18px;position:relative;box-shadow:0 0 0 3px #0b0912,0 0 40px rgba(255,95,216,.35);overflow:hidden}
.arcBox::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px)}
.arcBox h2{margin:0 0 4px;font:34px/1 var(--pix);letter-spacing:.12em;color:var(--acc);text-shadow:0 0 14px var(--acc)}
.arcBox>p{margin:0 0 14px;color:#fff;font-size:13px}
#arcX{position:absolute;top:10px;right:10px;width:34px;height:34px;background:#2a2433;border:2px solid var(--line);border-radius:50%;color:#fff;font:22px/1 var(--pix);cursor:pointer;z-index:2}
.arcGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{all:unset;box-sizing:border-box;cursor:pointer;display:block;background:#17131f;border:3px solid #3b3350;border-radius:12px;overflow:hidden;position:relative}
.card:hover,.card:focus-visible,.card.on{border-color:var(--acc2);box-shadow:0 0 22px rgba(127,240,255,.45);transform:translateY(-2px)}
.card .bn{aspect-ratio:16/9;width:100%;display:block;object-fit:cover;background:#0e0c12}
.card .tx{display:block;padding:10px 12px 12px;color:#fff}
.card .no{display:block;font:20px/1 var(--pix);color:var(--acc)}
.card b{display:block;font-size:15px;margin:2px 0}
.card small{display:block;font-size:12px;line-height:1.4;color:#fff}
.card .go{margin-top:8px;font:20px/1 var(--pix);color:var(--acc2);animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.fb{aspect-ratio:16/9;display:grid;place-items:center;text-align:center;font:30px/1.05 var(--pix);color:#fff;background:linear-gradient(180deg,#2b1b4a,#0f3b46 70%,#14202a);letter-spacing:.06em;text-shadow:0 0 12px var(--acc2)}
@media (max-width:640px){.arcGrid{grid-template-columns:1fr}.arcBox h2{font-size:28px}}

#os{position:fixed;inset:0;z-index:15;background:rgba(8,6,14,.88);display:grid;place-items:center;padding:12px}
#os[hidden]{display:none}
.osScreen{position:relative;width:min(1000px,100%);height:min(640px,calc(100vh - 24px));border:4px solid #0b0912;border-radius:14px;box-shadow:0 0 0 3px var(--acc),0 0 40px rgba(255,95,216,.4);overflow:hidden;background:linear-gradient(180deg,#2a1d4e 0%,#7a3a8a 45%,#ff8f6b 78%,#ffd09a 100%);color:#fff}
.osSun{position:absolute;left:62%;top:50%;width:150px;height:150px;border-radius:50%;background:#ffe3b0;box-shadow:0 0 80px 30px rgba(255,200,140,.5);transform:translateY(-10%)}
.osName{position:absolute;right:22px;bottom:70px;text-align:right;font:26px/1 var(--pix);letter-spacing:.1em;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.osName small{display:block;font:14px var(--body);letter-spacing:.04em;margin-top:6px}
#osX{position:absolute;top:8px;right:8px;z-index:5;width:32px;height:32px;background:#2a2433;border:2px solid var(--line);border-radius:50%;color:#fff;font:21px/1 var(--pix);cursor:pointer}
.osDesk{position:absolute;left:14px;top:14px;bottom:56px;display:grid;grid-template-columns:repeat(2,100px);grid-auto-rows:104px;gap:6px;align-content:start}
.ico{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border-radius:8px;text-align:center;font:600 12px/1.25 var(--body);color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.ico:hover,.ico:focus-visible{background:rgba(255,255,255,.2);outline:1px solid rgba(255,255,255,.6)}
.ico svg{width:46px;height:46px;flex:none}
.osWin[hidden]{display:none}
.osWin{position:absolute;left:240px;right:24px;top:36px;bottom:60px;background:#1a1624;border:2px solid var(--acc);border-radius:10px;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.55);overflow:hidden;z-index:3}
.osTitle{display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,#ff5fd8,#7a3a8a);color:#16131b;padding:5px 8px;font:700 13px var(--body)}
.osTitle b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.osTitle button{all:unset;cursor:pointer;width:24px;height:22px;text-align:center;font:700 18px/22px var(--body);background:rgba(255,255,255,.35);border-radius:4px}
.osTool{display:flex;align-items:center;gap:8px;padding:6px 8px;background:#241d30;border-bottom:1px solid var(--line);font-size:12px;color:#fff}
.osTool button{all:unset;cursor:pointer;padding:2px 10px;background:#3b3350;border-radius:4px;font-size:15px}
.osTool button:disabled{opacity:.35;cursor:default}
.osBody{flex:1;overflow:auto;padding:14px}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.file{all:unset;box-sizing:border-box;cursor:pointer;display:block;background:#241d30;border:2px solid #3b3350;border-radius:8px;overflow:hidden}
.file:hover,.file:focus-visible{border-color:var(--acc2)}
.file img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#0e0c12}
.file span{display:block;padding:7px 8px;font:600 12px/1.3 var(--body);color:#fff}
.vw h3{margin:10px 0 2px;font:700 18px/1.25 var(--body);color:#fff}
.vw .tg{font:19px/1 var(--pix);color:var(--acc);text-transform:uppercase;letter-spacing:.06em}
.vw p{margin:6px 0 10px;color:#fff;font-size:13.5px;line-height:1.55}
.vw .main{display:block;width:100%;max-height:300px;object-fit:contain;background:#0e0c12;border:2px solid var(--line);border-radius:8px;cursor:zoom-in}
.vw .cap{font:19px/1.2 var(--pix);color:#fff;margin:6px 0}
.vw .th{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.vw .th button{all:unset;cursor:pointer;flex:0 0 auto;width:54px;height:54px;border:2px solid transparent;border-radius:6px;overflow:hidden;background:#0e0c12}
.vw .th button.on{border-color:var(--acc)}
.vw .th img{width:100%;height:100%;object-fit:cover;display:block}
.vw dl{margin:0;display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.vw dl div{display:grid;grid-template-columns:86px 1fr;gap:10px;font-size:13px;color:#fff}
.vw dt{font:19px/1.2 var(--pix);color:#fff;text-transform:uppercase}.vw dd{margin:0;overflow-wrap:anywhere}.vw dd a{color:var(--acc2);font-weight:600}
.osMenu{position:absolute;left:10px;bottom:46px;z-index:6;background:#1a1624;border:2px solid var(--acc);border-radius:10px;padding:6px;display:grid;gap:2px;min-width:200px}
.osMenu[hidden]{display:none}
.osMenu button{all:unset;cursor:pointer;padding:8px 10px;border-radius:6px;font:600 13px var(--body);color:#fff}
.osMenu button:hover,.osMenu button:focus-visible{background:#3b3350}
.osBar{position:absolute;left:0;right:0;bottom:0;height:40px;background:rgba(14,10,22,.92);border-top:2px solid var(--acc);display:flex;align-items:center;gap:10px;padding:0 10px;z-index:5}
#osStart{all:unset;cursor:pointer;background:var(--acc);color:#16131b;font:700 13px var(--body);padding:5px 12px;border-radius:6px}
#osTask{flex:1;min-width:0;font-size:12px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#osClock{font:20px/1 var(--pix);color:#fff}
@media (max-width:720px){
 .osScreen{height:calc(100vh - 24px)}
 .osDesk{grid-template-columns:repeat(3,92px);right:8px}
 .osWin{left:8px;right:8px;top:8px;bottom:48px}
 .osName,.osSun{display:none}
 #osX{top:auto;bottom:4px;right:70px;width:32px;height:32px;z-index:6}
}

.osDesk{left:22px;top:22px;bottom:56px;width:min(470px,60%);grid-template-columns:repeat(4,1fr);grid-auto-rows:112px;gap:8px 6px}
.app{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px;border-radius:12px;text-align:center}
.app:hover .tile,.app:focus-visible .tile{transform:translateY(-3px) scale(1.06);box-shadow:0 8px 18px rgba(0,0,0,.45)}
.app:focus-visible{outline:2px solid #fff}
.app .tile.lg{padding:7px}.app .tile.lg img{position:absolute;left:7px;top:7px;width:calc(100% - 14px);height:calc(100% - 14px);object-fit:contain;image-rendering:auto;pointer-events:none}.app .tile .bd{position:absolute;right:-8px;bottom:-8px;font-style:normal;font-size:12px;line-height:1;width:20px;height:20px;border-radius:50%;background:#1b1530;display:grid;place-items:center;box-shadow:0 2px 4px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.25)}.wlg{width:20px;height:20px;object-fit:contain;border-radius:5px;padding:2px;vertical-align:middle}
.app .tile{position:relative;width:62px;height:62px;border-radius:16px;display:grid;place-items:center;font-size:30px;box-shadow:0 4px 10px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .15s}
.app .seen{position:absolute;right:-5px;top:-5px;width:20px;height:20px;border-radius:50%;background:#7ff0ff;color:#16131b;font:700 12px/20px var(--body);font-style:normal;text-align:center}
.app .seen[hidden]{display:none}
.app .lb{font:600 11.5px/1.25 var(--body);color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.8);max-width:92px}
.osWin.isapp{left:0;right:0;top:0;bottom:40px;border:0;border-radius:0;z-index:4}
.osWin.isapp .osTitle{background:linear-gradient(90deg,var(--a1,#ff5fd8),var(--a2,#7a3a8a));color:#fff;padding:8px 12px;font-size:15px}
.osWin.isapp .osTitle button{background:rgba(0,0,0,.28);color:#fff}
.osWin.launch{animation:appIn .28s ease-out}
@keyframes appIn{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.osWin.isapp .osBody{padding:18px 22px}
.osWin.isapp .vw{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:start}
.osWin.isapp .vw .main{max-height:none;aspect-ratio:16/10;object-fit:contain}
.osWin.isapp .vw h3{margin-top:4px;font-size:22px}
.osWin.isapp .vw p{font-size:14px}
@media (max-width:720px){
 .osDesk{width:auto;right:12px;left:12px;grid-template-columns:repeat(3,1fr);overflow:auto}
 .osWin.isapp .vw{grid-template-columns:minmax(0,1fr)}
 .osWin.isapp .vw>div{min-width:0}
 .vw .th{max-width:100%}
 .osWin.isapp .osBody{padding:12px}
}
@media (prefers-reduced-motion:reduce){.osWin.launch{animation:none}}
.stage{position:relative;aspect-ratio:1/1.05;max-height:420px;width:100%;overflow:hidden;border-radius:12px;border:2px solid var(--line);background:linear-gradient(165deg,#2a1d4e 0%,#4a2060 55%,#14101e 100%)}
.stage .disc{position:absolute;left:50%;top:56%;width:86%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 35% 30%,#ffe9c2,#ff9a6b 42%,#ff5fd8 100%);box-shadow:0 0 100px rgba(255,95,216,.4)}
.stage .ring{position:absolute;left:50%;top:56%;width:108%;aspect-ratio:1;border:1px solid rgba(255,255,255,.35);border-radius:50%;transform:translate(-50%,-50%) rotate(-24deg) scaleX(.72)}
.stage .ring.b{width:96%;transform:translate(-50%,-50%) rotate(28deg) scaleX(.7);opacity:.6}
.stage .mono{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:800 clamp(120px,18vw,220px)/1 var(--body);letter-spacing:-.12em;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.28);user-select:none}
.vw .stage img.main,.stage img.portrait{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:100%;width:auto;max-width:none;max-height:none;border:0;border-radius:0;background:none;aspect-ratio:auto;object-fit:contain;filter:drop-shadow(0 24px 30px rgba(0,0,0,.45));-webkit-mask-image:linear-gradient(180deg,#000 85%,transparent 100%);mask-image:linear-gradient(180deg,#000 85%,transparent 100%)}
#pMain.about{background:radial-gradient(circle at 50% 60%,#ff9a6b 0 38%,rgba(255,95,216,.9) 39% 41%,transparent 42%),linear-gradient(165deg,#2a1d4e,#14101e)}
#os.inapp #osX{display:none}
#env{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;padding:4px;background:var(--panel);border:2px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
#env button{all:unset;cursor:pointer;width:38px;height:34px;text-align:center;font-size:19px;line-height:34px;border-radius:8px;opacity:.6}
#env button.on{background:rgba(255,95,216,.28);opacity:1}
#env button:hover,#env button:focus-visible{opacity:1;outline:1px solid var(--acc)}
#fab{all:unset;position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;cursor:pointer;background:var(--acc);color:#16131b;font:700 14px var(--body);padding:11px 16px;border-radius:999px;box-shadow:0 6px 18px rgba(255,95,216,.45)}
#fab:hover{filter:brightness(1.1)}
body.open #env,body.open #fab{display:none}
#fab{display:flex;align-items:center;gap:9px}
#fab i{width:10px;height:10px;border-radius:50%;background:#0f9d6a;box-shadow:0 0 0 2px #fff,0 0 0 0 rgba(15,157,106,.7);animation:op 1.8s infinite}

    else{
      tx=dx/d*3.2;tz=dz/d*3.2;
      var want=Math.atan2(dx,-dz),df=want-FP.a;df=Math.atan2(Math.sin(df),Math.cos(df));FP.a+=df*Math.min(1,dt*4.5);
    }
  }
  var k=Math.min(1,dt*10);FP.vx+=(tx-FP.vx)*k;FP.vz+=(tz-FP.vz)*k;
  var nx=FP.x+FP.vx*dt,nz=FP.z+FP.vz*dt,moved=0;
  if(!hitCol(nx,FP.z)){moved+=Math.abs(nx-FP.x);FP.x=nx;}
  if(!hitCol(FP.x,nz)){moved+=Math.abs(nz-FP.z);FP.z=nz;}
  var spd=Math.hypot(FP.vx,FP.vz);
  if(FP.walk&&moved<spd*dt*0.25)FP.stuck+=dt;else FP.stuck=0;
  if(spd>0.3)FP.bob+=spd*dt*2.6;
}
var fpFloor=new THREE.Plane(new THREE.Vector3(0,1,0),0),fpHit=new THREE.Vector3();
function walkToPoint(cx,cy){
  ndc.set(cx/W*2-1,-(cy/H)*2+1);ray.setFromCamera(ndc,camera);
  if(ray.ray.intersectPlane(fpFloor,fpHit)&&!hitCol(fpHit.x,fpHit.z)){FP.walk={x:fpHit.x,z:fpHit.z};FP.stuck=0;}
}
var KEYMAP={w:"w",a:"a",s:"s",d:"d",q:"q",e:"e",ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right"};
window.addEventListener("keydown",function(e){
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  var k=KEYMAP[e.key]||KEYMAP[(e.key||"").toLowerCase()];
  if(e.key==="Escape"&&(VIEW.mode==="fps"||VIEW.mode==="in")&&!overlaysOpen()){if(locked()||performance.now()-lastUnlock<500)return;setView("iso");return;}
  if((e.key==="v"||e.key==="V")&&!overlaysOpen()){setView(VIEW.mode==="iso"?"fps":"iso");return;}
  if(VIEW.mode==="fps"&&k&&!overlaysOpen()){keys[k]=true;e.preventDefault();}
},true);
window.addEventListener("keyup",function(e){var k=KEYMAP[e.key]||KEYMAP[(e.key||"").toLowerCase()];if(k)keys[k]=false;});
window.addEventListener("blur",function(){keys={};});
$("view").addEventListener("click",function(){setView(VIEW.mode==="iso"?"fps":"iso");this.blur();});
(function(){
  var j=$("joy"),kn=$("joyK");
  function mv(e){var r=j.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),l=Math.hypot(dx,dy),m=40;if(l>m){dx*=m/l;dy*=m/l;}
    joy.x=dx/m;joy.y=dy/m;kn.style.transform="translate("+dx+"px,"+dy+"px)";}
  j.addEventListener("pointerdown",function(e){joy.id=e.pointerId;j.setPointerCapture(e.pointerId);mv(e);e.preventDefault();});
  j.addEventListener("pointermove",function(e){if(e.pointerId===joy.id)mv(e);});
  function up(e){if(e.pointerId!==joy.id)return;joy.id=null;joy.x=joy.y=0;kn.style.transform="";}
  j.addEventListener("pointerup",up);j.addEventListener("pointercancel",up);
})();

var last=performance.now(),v3=new THREE.Vector3(),zEl=$("zVal");
function frame(now){
  var dt=Math.min((now-last)/1000,0.05);last=now;
  var k=reduce?1:1-Math.exp(-dt*7);
  cur.zoom+=(goal.zoom-cur.zoom)*k;cur.yaw+=(goal.yaw-cur.yaw)*k;cur.shift+=(goal.shift-cur.shift)*k;
  cur.target.lerp(goal.target,k);
  applyShift(false);placeCamera();viewUpdate(dt);
  zEl.textContent=Math.round(cur.zoom*100)+"%";
  if(!sel&&VIEW.mode==="iso"){
    PINIDS.forEach(function(pid){
      var it=items[pid];v3.copy(it.pin).project(camera);
      it.pinEl.style.transform="translate3d("+((v3.x*0.5+0.5)*W)+"px,"+((-v3.y*0.5+0.5)*H)+"px,0)";
    });
  }
  animate(now);
  if(composer)composer.render();else renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
window.addEventListener("resize",resize);
resize();renderList();canvas.style.cursor="grab";
requestAnimationFrame(frame);
})();
